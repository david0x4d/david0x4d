<svg xmlns="http://www.w3.org/2000/svg" width="260" height="52" viewBox="0 0 260 52" role="img" aria-label="¿Hablamos?">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="btn"><rect width="260" height="52" rx="26"/></clipPath>
  </defs>
  <style>
    .env { animation: bounce 2s ease-in-out infinite; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 70% { transform: translateY(-4px); } 80% { transform: translateY(0); } 90% { transform: translateY(-2px); } }
  </style>
  <g>
    <rect width="260" height="52" rx="26" fill="url(#accent)"/>
    <g clip-path="url(#btn)">
      <rect x="-80" y="0" width="80" height="52" fill="url(#shine)" transform="skewX(-20)">
        <animate attributeName="x" values="-120;340" dur="2.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g class="env">
      <g transform="translate(42 15)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="2" width="22" height="16" rx="3"/>
        <path d="M1 4l10 8 10-8"/>
      </g>
    </g>
    <text x="80" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">¿Hablamos?</text>
  </g>
</svg>
