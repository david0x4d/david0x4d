<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="David Martin Narváez — Estudiante de DAW y Máster en Ciberseguridad">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f81f7" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="typed">
      <rect x="60" y="208" width="0" height="28">
        <animate attributeName="width" calcMode="discrete" values="0.0;8.8;17.6;26.4;35.2;44.0;52.8;61.6;70.4;79.2;88.0;96.8;105.6;114.4;123.2;132.0;140.8;149.6;158.4;167.2;176.0;184.8;193.6;202.4;211.2;220.0;228.8;237.6;246.4;255.2;264.0;272.8;281.6;290.4;299.2;308.0;316.8;325.6;334.4" dur="2.2s" begin="1.6s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    .in { opacity: 0; animation: in .8s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .bar { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow .8s ease-out .1s forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
  </style>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <circle class="pulse" cx="790" cy="60" r="160" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="18" fill="none" stroke="#30363d"/>
  <rect class="bar" x="60" y="62" width="64" height="5" rx="2.5" fill="url(#accent)"/>
  <text class="in" style="animation-delay:.2s" x="60" y="115" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f0f6fc">David Martin Narváez</text>
  <text class="in" style="animation-delay:.6s" x="60" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e">Estudiante de Desarrollo de Aplicaciones Web (DAW)</text>
  <text class="in" style="animation-delay:.9s" x="60" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e">Máster en Ciberseguridad</text>
  <g clip-path="url(#typed)">
    <text x="60" y="228" font-family="Consolas, Menlo, monospace" font-size="16" fill="#3fb950">&gt; aprendiendo a construir y a proteger</text>
  </g>
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="1.6s" fill="freeze"/>
    <rect class="cursor" x="61" y="213" width="8" height="18" fill="#3fb950">
      <animate attributeName="x" calcMode="discrete" values="61.0;69.8;78.6;87.4;96.2;105.0;113.8;122.6;131.4;140.2;149.0;157.8;166.6;175.4;184.2;193.0;201.8;210.6;219.4;228.2;237.0;245.8;254.6;263.4;272.2;281.0;289.8;298.6;307.4;316.2;325.0;333.8;342.6;351.4;360.2;369.0;377.8;386.6;395.4" dur="2.2s" begin="1.6s" fill="freeze"/>
    </rect>
  </g>
</svg>
